<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rate the Fam 💕</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="app">

    <header class="topbar">

      <button id="backBtn" class="icon-btn hidden" aria-label="Go back">←</button>

      <div class="logo">💕 Rate the Fam</div>

      <button id="leaderboardBtn" class="small-btn">🏆</button>

    </header>

    <main id="homeView" class="view">

      <section class="hero">

        <div class="heart">💗</div>

        <h1>Rate the Fam</h1>

        <p>Give everyone a rating and see who takes the crown 👑</p>

      </section>

      <div id="peopleGrid" class="people-grid"></div>

    </main>

    <main id="personView" class="view hidden">

      <section class="person-header">

        <img id="personPhoto" class="person-photo" alt="">

        <h1 id="personName"></h1>

        <p>How would you rate them?</p>

      </section>

      <div id="categories" class="categories"></div>

      <button id="submitBtn" class="primary-btn">Submit Rating 💕</button>

      <p id="errorText" class="error"></p>

    </main>

    <main id="resultsView" class="view hidden">

      <section class="results-card">

        <div id="resultEmoji" class="result-emoji">🎉</div>

        <h1 id="resultTitle">Rating submitted!</h1>

        <p id="resultText"></p>

        <div class="score-ring">

          <span id="resultPercent">0%</span>

        </div>

        <div id="resultStars" class="big-stars"></div>

        <button id="nextBtn" class="primary-btn">Continue 💗</button>

      </section>

    </main>

    <main id="leaderboardView" class="view hidden">

      <section class="hero compact">

        <div class="heart">🏆</div>

        <h1>Leaderboard</h1>

        <p>Everyone's current scores</p>

      </section>

      <div id="leaderboard" class="leaderboard"></div>

      <button id="homeBtn" class="secondary-btn">← Back to People</button>

    </main>

  </div>

  <script src="script.js"></script>

</body>

</html>
